<h2 mat-dialog-title>Batch Transaction Entry</h2>

<mat-dialog-content>
  <form [formGroup]="transactionFormGroup">
    <div formArrayName="records" class="records-container">
      
      <!-- Loop through dynamic rows -->
      <div *ngFor="let record of records.controls; let i = index" 
           [formGroupName]="i" 
           class="record-row">

        <!-- 1. Category Dropdown -->
        <mat-form-field appearance="outline" class="col-category">
          <mat-label>Category</mat-label>
          <mat-select formControlName="category">
            <mat-option *ngFor="let cat of categoriesList" [value]="cat">
              {{ cat.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="record.get('category')?.hasError('required')">
            Category required
          </mat-error>
        </mat-form-field>

        <!-- 2. Sub Category Textbox -->
        <mat-form-field appearance="outline" class="col-subcategory">
          <mat-label>Sub Category</mat-label>
          <input matInput formControlName="subCategory" placeholder="e.g. Groceries">
        </mat-form-field>

        <!-- 3. Decimal Amount Input -->
        <mat-form-field appearance="outline" class="col-amount">
          <mat-label>Amount</mat-label>
          <input matInput type="number" step="0.01" formControlName="amount" placeholder="0.00">
          <span matPrefix>$&nbsp;</span>
          <mat-error *ngIf="record.get('amount')?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="record.get('amount')?.hasError('min')">Min $0.01</mat-error>
        </mat-form-field>

        <!-- 4. Date Picker Field -->
        <mat-form-field appearance="outline" class="col-date">
          <mat-label>Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="date">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error *ngIf="record.get('date')?.hasError('required')">Date required</mat-error>
        </mat-form-field>

        <!-- 5. Per-Row Action Buttons (+) and (-) -->
        <div class="row-actions">
          <button mat-icon-button color="primary" type="button" (click)="addItem()" title="Add Row">
            <mat-icon>add_circle_outline</mat-icon>
          </button>
          
          <button mat-icon-button color="warn" type="button" (click)="removeItem(i)" 
                  [disabled]="records.length === 1" title="Remove Row">
            <mat-icon>remove_circle_outline</mat-icon>
          </button>
        </div>

      </div>
    </div>
  </form>
</mat-dialog-content>

<!-- Global Footer Actions -->
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="onSubmit()" 
          [disabled]="transactionFormGroup.invalid">
    Submit
  </button>
</mat-dialog-actions>
