  <table mat-table [dataSource]="dataSource" class="scroll-container">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element" class="font-medium"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let element"> {{element.description}} </td>
    </ng-container>

    <ng-container matColumnDef="createdDate">
      <th mat-header-cell *matHeaderCellDef> Created Date </th>
      <td mat-cell *matCellDef="let element"> {{element.createdDate | date:'mediumDate'}} </td>
    </ng-container>

   <ng-container matColumnDef="plannedCost">
      <th mat-header-cell *matHeaderCellDef> Planned Cost </th>
      <td mat-cell *matCellDef="let element"> {{element.plannedCost | currency}} </td>
    </ng-container>

    <ng-container matColumnDef="actualCost">
      <th mat-header-cell *matHeaderCellDef> Actual Cost </th>
      <td mat-cell *matCellDef="let element"> {{element.actualCost | currency}} </td>
    </ng-container>

     <ng-container matColumnDef="difference">
      <th mat-header-cell *matHeaderCellDef> Difference </th>
      <td mat-cell *matCellDef="let element"> {{element.difference | currency}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
  </table>
